name: WEMS Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile app.py config.py database/db.py

      - name: Smoke-test Flask routes
        run: |
          python - <<'PY'
          import app

          client = app.app.test_client()
          routes = [
              "/",
              "/clients",
              "/services",
              "/jobs",
              "/invoices",
              "/payments",
              "/reports",
              "/api/service/999999",
              "/api/client/999999/jobs",
          ]

          for path in routes:
              response = client.get(path)
              assert response.status_code in (200, 404), f"{path}: {response.status_code}"

          response = client.get("/definitely-not-a-real-wems-route")
          assert response.status_code == 404, response.status_code

          print("WEMS route smoke test passed.")
          PY
