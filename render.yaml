services:
  - type: web
    name: wems
    runtime: python
    plan: 1c-1g
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: WEMS_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wems-db
          property: connectionString
      - key: WEMS_DATA_DIR
        value: /var/data
    disk:
      name: wems-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: wems-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: wems
    user: wems
