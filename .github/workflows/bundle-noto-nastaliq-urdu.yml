name: Bundle Noto Nastaliq Urdu Font

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle-font:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and install Noto Nastaliq Urdu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/fonts
          rm -f static/fonts/NotoNastaliqUrdu-Regular.ttf static/fonts/OFL.txt
          workdir="$(mktemp -d)"
          unzip -q static/css/Noto_Nastaliq_Urdu.zip -d "$workdir"
          font="$(find "$workdir" -type f \( -iname '*.ttf' -o -iname '*.otf' \) | head -n 1)"
          if [ -z "$font" ]; then echo "No TTF/OTF font file found." >&2; exit 1; fi
          cp "$font" static/fonts/NotoNastaliqUrdu-Regular.ttf
          license="$(find "$workdir" -type f \( -iname 'OFL.txt' -o -iname 'LICENSE*' \) | head -n 1 || true)"
          if [ -n "$license" ]; then cp "$license" static/fonts/OFL.txt; fi

      - name: Configure local offline font
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('static/css/fonts.css')
          text = p.read_text(encoding='utf-8')
          import re
          block = '''@font-face {
            font-family: "Noto Nastaliq Urdu";
            src: url("../fonts/NotoNastaliqUrdu-Regular.ttf") format("truetype");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
          }'''
          text = re.sub(r'@font-face\s*\{.*?\}', block, text, count=1, flags=re.S)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit bundled font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/fonts static/css/fonts.css
          if git diff --cached --quiet; then echo "No font changes to commit."; exit 0; fi
          git commit -m "Bundle Noto Nastaliq Urdu font for offline WEMS"
          git push
