name: WEMS Windows Build Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Build WEMS
        run: pyinstaller --clean --noconfirm WEMS.spec

      - name: Smoke-test packaged WEMS
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\WEMS\WEMS.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $ready = $false
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) {
                throw "WEMS.exe exited during startup with code $($p.ExitCode). Launcher log: $((Join-Path (Split-Path $exe) 'wems-launcher.log'))"
              }
              try {
                # /healthz is intentionally unauthenticated and lightweight, so
                # the packaged build can be tested before any admin account is
                # provisioned. The root route redirects to login when the test
                # database has no users, which is expected and must not be
                # mistaken for a startup failure.
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:5000/healthz" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match '"status"\s*:\s*"ok"') {
                  $ready = $true
                  break
                }
              }
              catch {
                # Continue polling until the startup deadline.
              }
            } while ((Get-Date) -lt $deadline)

            if (-not $ready) {
              $log = Join-Path (Split-Path $exe) "wems-launcher.log"
              if (Test-Path $log) {
                Write-Host "===== WEMS launcher log ====="
                Get-Content $log
                Write-Host "===== End WEMS launcher log ====="
              }
              throw "WEMS did not become available on http://127.0.0.1:5000/ within 30 seconds."
            }
          }
          finally {
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path "dist\WEMS\*" -DestinationPath "WEMS-Windows-Portable.zip" -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WEMS-Windows-Portable
          path: WEMS-Windows-Portable.zip
          if-no-files-found: error
