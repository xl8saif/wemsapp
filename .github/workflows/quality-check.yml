name: WEMS Quality Check

on:
  push:
    branches: [main, online-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile app.py config.py database/db.py scripts/migrate_sqlite_to_postgres.py

      - name: Smoke-test Flask routes
        run: |
          python - <<'PY'
          import app

          client = app.app.test_client()

          # Public routes must be accessible without authentication.
          response = client.get("/setup")
          assert response.status_code == 200, f"/setup: {response.status_code}"

          response = client.get("/login")
          assert response.status_code == 302, f"/login: {response.status_code}"
          assert "/setup" in response.headers.get("Location", ""), "login should redirect to setup when no users exist"

          # Business routes must redirect unauthenticated users to login.
          protected_routes = [
              "/",
              "/clients",
              "/services",
              "/jobs",
              "/invoices",
              "/payments",
              "/reports",
              "/api/service/999999",
              "/api/client/999999/jobs",
          ]

          for path in protected_routes:
              response = client.get(path)
              assert response.status_code == 302, f"{path}: {response.status_code}"
              assert "/login" in response.headers.get("Location", ""), f"{path}: missing login redirect"

          # Unknown routes must return 404.
          response = client.get("/definitely-not-a-real-wems-route")
          assert response.status_code == 404, response.status_code

          print("WEMS route smoke test passed.")
          PY
