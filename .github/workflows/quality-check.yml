name: WEMS Quality Check

on:
  push:
    branches: [main, online-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile app.py config.py database/db.py scripts/migrate_sqlite_to_postgres.py wems_launcher.py

      - name: Smoke-test Flask routes
        run: |
          python - <<'PY'
          import os

          # Online WEMS does not allow public account registration. The first
          # administrator is provisioned from deployment secrets, so CI must
          # provide the same bootstrap inputs before importing the application.
          os.environ["WEMS_ADMIN_USERNAME"] = "ci-admin"
          os.environ["WEMS_ADMIN_PASSWORD"] = "CI-test-password-123!"
          os.environ["WEMS_ADMIN_FULL_NAME"] = "CI Admin"

          import app

          client = app.app.test_client()

          # Public routes must be reachable without authentication.
          # /setup is intentionally disabled and redirects to /login.
          response = client.get("/setup")
          assert response.status_code == 302, f"/setup: {response.status_code}"
          assert "/login" in response.headers.get("Location", ""), "setup should redirect to login"

          response = client.get("/healthz")
          assert response.status_code == 200, f"/healthz: {response.status_code}"
          assert response.json["status"] == "ok", response.json

          response = client.get("/login")
          assert response.status_code == 200, f"/login: {response.status_code}"

          # Protected business routes must redirect unauthenticated users to login.
          protected_routes = [
              "/",
              "/clients",
              "/services",
              "/jobs",
              "/invoices",
              "/payments",
              "/reports",
              "/api/service/999999",
              "/api/client/999999/jobs",
          ]

          for path in protected_routes:
              response = client.get(path)
              assert response.status_code == 302, f"{path}: {response.status_code}"
              assert "/login" in response.headers.get("Location", ""), f"{path}: missing login redirect"

          # The CI administrator was provisioned by init_db() from the
          # environment variables above. Verify authenticated routes.
          response = client.post(
              "/login",
              data={
                  "username": "ci-admin",
                  "password": "CI-test-password-123!",
              },
              follow_redirects=False,
          )
          assert response.status_code == 302, f"/login POST: {response.status_code}"
          assert "/" in response.headers.get("Location", ""), "successful login should redirect to dashboard"

          # The same protected routes should be renderable after authentication.
          for path in ["/", "/clients", "/services", "/jobs", "/invoices", "/payments", "/reports"]:
              response = client.get(path)
              assert response.status_code == 200, f"authenticated {path}: {response.status_code}"

          # Unknown routes are checked while authenticated so the login gate
          # cannot mask Flask's actual 404 response.
          response = client.get("/definitely-not-a-real-wems-route")
          assert response.status_code == 404, response.status_code

          print("WEMS route smoke test passed.")
          PY
